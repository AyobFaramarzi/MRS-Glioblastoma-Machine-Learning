<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="white"/><text x="60" y="65" font-family="Arial" font-size="34" font-weight="700">Earlier MRS Work — 2018 SVM Study</text><text x="60" y="102" font-family="Arial" font-size="18" fill="#555">Original visual summary of the earlier glioblastoma MRS classification study</text><line x1="60" y1="135" x2="1140" y2="135" stroke="#ccc"/><rect x="70" y="195" width="220" height="85" rx="15" fill="#f4f4f4" stroke="#888"/><text x="180" y="230" text-anchor="middle" font-family="Arial" font-size="20">MRS data</text><text x="180" y="258" text-anchor="middle" font-family="Arial" font-size="16">Tumor / healthy tissue</text><line x1="290" y1="237" x2="360" y2="237" stroke="#555" stroke-width="4"/><polygon points="360,237 345,229 345,245" fill="#555"/><rect x="370" y="195" width="220" height="85" rx="15" fill="#f4f4f4" stroke="#888"/><text x="480" y="230" text-anchor="middle" font-family="Arial" font-size="20">SIVIC</text><text x="480" y="258" text-anchor="middle" font-family="Arial" font-size="16">Tumor-region / voxel selection</text><line x1="590" y1="237" x2="660" y2="237" stroke="#555" stroke-width="4"/><polygon points="660,237 645,229 645,245" fill="#555"/><rect x="670" y="195" width="220" height="85" rx="15" fill="#f4f4f4" stroke="#888"/><text x="780" y="230" text-anchor="middle" font-family="Arial" font-size="20">TARQUIN</text><text x="780" y="258" text-anchor="middle" font-family="Arial" font-size="16">Water suppression / MRS processing</text><line x1="890" y1="237" x2="960" y2="237" stroke="#555" stroke-width="4"/><polygon points="960,237 945,229 945,245" fill="#555"/><rect x="970" y="195" width="165" height="85" rx="15" fill="#f4f4f4" stroke="#888"/><text x="1052" y="230" text-anchor="middle" font-family="Arial" font-size="20">SVM</text><text x="1052" y="258" text-anchor="middle" font-family="Arial" font-size="16">Tumor detection</text><text x="70" y="350" font-family="Arial" font-size="22" font-weight="700">Research contribution</text><text x="70" y="390" font-family="Arial" font-size="18">This study represents an early step in the MRS + machine-learning line of work that later expanded</text><text x="70" y="425" font-family="Arial" font-size="18">to comparisons of SVM, MLP, and fuzzy classification methods in the 2021 study.</text><text x="70" y="480" font-family="Arial" font-size="15" fill="#555">Based on the published 2018 study; diagram is an original visual summary.</text></svg>