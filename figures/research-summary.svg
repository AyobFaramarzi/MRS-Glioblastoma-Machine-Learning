<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="white"/><text x="60" y="65" font-family="Arial" font-size="34" font-weight="700">MRS + Machine Learning — Glioblastoma Detection</text><text x="60" y="100" font-family="Arial" font-size="18" fill="#555">Original visual summary based on the 2021 study and related earlier SVM work</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#ccc"/><text x="60" y="170" font-family="Arial" font-size="22" font-weight="700">Study pipeline</text><rect x="60" y="205" width="180" height="75" rx="14" fill="#f4f4f4" stroke="#888"/><text x="150" y="248" text-anchor="middle" font-family="Arial" font-size="19">Multivoxel MRS</text><line x1="240" y1="242" x2="300" y2="242" stroke="#555" stroke-width="4"/><polygon points="300,242 285,234 285,250" fill="#555"/><rect x="310" y="205" width="180" height="75" rx="14" fill="#f4f4f4" stroke="#888"/><text x="400" y="248" text-anchor="middle" font-family="Arial" font-size="19">SIVIC / TARQUIN</text><line x1="490" y1="242" x2="550" y2="242" stroke="#555" stroke-width="4"/><polygon points="550,242 535,234 535,250" fill="#555"/><rect x="560" y="205" width="180" height="75" rx="14" fill="#f4f4f4" stroke="#888"/><text x="650" y="248" text-anchor="middle" font-family="Arial" font-size="19">Cho + NAA</text><line x1="740" y1="242" x2="800" y2="242" stroke="#555" stroke-width="4"/><polygon points="800,242 785,234 785,250" fill="#555"/><rect x="810" y="205" width="300" height="75" rx="14" fill="#f4f4f4" stroke="#888"/><text x="960" y="248" text-anchor="middle" font-family="Arial" font-size="19">ML classification</text><text x="60" y="345" font-family="Arial" font-size="22" font-weight="700">Reported classification performance</text><line x1="115" y1="610" x2="700" y2="610" stroke="#333"/><line x1="115" y1="390" x2="115" y2="610" stroke="#333"/><text x="95" y="614" text-anchor="end" font-family="Arial" font-size="13">0%</text><text x="95" y="505" text-anchor="end" font-family="Arial" font-size="13">50%</text><text x="95" y="397" text-anchor="end" font-family="Arial" font-size="13">100%</text><g font-family="Arial" font-size="14" text-anchor="middle"><rect x="145" y="445" width="45" height="165" fill="#777"/><rect x="195" y="450" width="45" height="160" fill="#bbb"/><text x="167" y="435">81.1</text><text x="217" y="440">78.3</text><text x="192" y="636">MLP</text><rect x="295" y="473" width="45" height="137" fill="#777"/><rect x="345" y="471" width="45" height="139" fill="#bbb"/><text x="317" y="463">65.6</text><text x="367" y="461">63.0</text><text x="342" y="636">Linear SVM</text><rect x="445" y="422" width="45" height="188" fill="#777"/><rect x="495" y="429" width="45" height="181" fill="#bbb"/><text x="467" y="412">89.7</text><text x="517" y="419">87.0</text><text x="492" y="636">Gaussian SVM</text><rect x="595" y="432" width="45" height="178" fill="#777"/><rect x="645" y="434" width="45" height="176" fill="#bbb"/><text x="617" y="422">83.72</text><text x="667" y="424">82.5</text><text x="642" y="636">Fuzzy</text></g><text x="820" y="345" font-family="Arial" font-size="22" font-weight="700">Earlier work</text><rect x="820" y="380" width="300" height="145" rx="18" fill="#f7f7f7" stroke="#999"/><text x="970" y="420" text-anchor="middle" font-family="Arial" font-size="19">2018 study</text><text x="970" y="456" text-anchor="middle" font-family="Arial" font-size="17">MRS + Support Vector Machine</text><text x="970" y="492" text-anchor="middle" font-family="Arial" font-size="16">Foundation for later classifier comparisons</text><text x="60" y="675" font-family="Arial" font-size="15" fill="#555">Bars show the training and testing accuracies reported in the 2021 paper; visual layout is original.</text></svg>